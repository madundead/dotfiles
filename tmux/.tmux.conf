# ---- prefix ----
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---- general ----
set -g extended-keys on
set -g extended-keys-format csi-u
set -g base-index 1
set -g pane-base-index 1
set -g mode-keys vi
set -g renumber-windows on
set -g detach-on-destroy off
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---- theme & status bar ----
set -g status-style fg=#D8DEE9,bg=black
set -g window-status-style fg=#808080,bg=default
set -g window-status-current-style fg=#D78700,bg=default
set -g window-status-format " ━━━━━━ "
set -g window-status-current-format " ━━━━━━ "
set -g message-style fg=#88C0D0,bg=#2E3440
set -g status-left " #[fg=#88C0D0]#S #[default]"
set -g status-left-length 24
set -g status-right '#(command -v kubectl >/dev/null 2>&1 || exit; ctx=$(kubectl config current-context 2>/dev/null); ns=$(kubectl config view --minify -o jsonpath={..namespace} 2>/dev/null); [ -n "$ctx" ] && echo "#[fg=#88C0D0]$ctx#[fg=#808080]:#[fg=#88C0D0]${ns:-default} ")'
set -g status-right-length 60
set -g status-justify centre

# ---- popup (fzf etc.) ----
set -g popup-border-lines rounded
set -g popup-style bg=#2E3440
set -g popup-border-style fg=#88C0D0

# ---- panes ----
bind "'" split-window -h
bind p split-window -v
bind x kill-pane
bind C-l send-keys 'C-l'

# ---- windows (small keebs) ----
bind q select-window -t 1
bind w select-window -t 2
bind e select-window -t 3
bind r select-window -t 4
bind t select-window -t 5
bind y select-window -t 6

# ---- copy mode ----
unbind [
bind Escape copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ---- sessions ----
bind n command-prompt -p "new session:" "new-session -s '%%'"
bind , command-prompt -I "#S" "rename-session '%%'"
bind [ switch-client -p
bind ] switch-client -n
bind f display-popup -E -w 60% -h 40% -x C -y C -T "sessions" \
  "tmux list-sessions -F '#{session_name}' | fzf | xargs tmux switch-client -t"
bind s choose-tree -Zs
# ---- plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ---- startup ----
new-session -A -s default
run '~/.tmux/plugins/tpm/tpm'
