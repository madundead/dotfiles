general {
    lock_cmd = 
    before_sleep_cmd = 
    after_sleep_cmd = 
    ignore_dbus_inhibit = false
}

# Blank the displays and TV panel after 20 minutes of inactivity
listener {
    timeout = 1200
    on-timeout = /home/madundead/.scripts/lgtv/ctl off
    on-resume = /home/madundead/.scripts/lgtv/ctl on
}

# Full TV standby after 1 hour of inactivity
listener {
    timeout = 3600
    on-timeout = /home/madundead/.scripts/lgtv/ctl powerOff
    on-resume = /home/madundead/.scripts/lgtv/ctl on
}
